<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lớp văn thầy Hiếu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10304d;--mut:#58738a;--blue:#2563eb;--sky:#38bdf8;--acc:#f5b942;--red:#d6455b;--line:rgba(16,48,77,.14);--inp:rgba(255,255,255,.85);--glass:rgba(255,255,255,.66);--sh:0 8px 30px rgba(16,48,77,.13);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif;background:#e8f2fd}
h1,h2,h3{font-weight:700;margin:0;letter-spacing:-.01em}h1{font-size:22px}h2{font-size:24px;margin-bottom:12px}h3{font-size:16px}
.bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;overflow:hidden;view-transition-name:bg;transition:background-color .6s}
.bg::before,.bg::after{content:'';position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(80px);opacity:.5}
.bg::before{background:var(--c1);left:-18vmax;top:-24vmax;animation:fl 20s ease-in-out infinite alternate}
.bg::after{background:var(--c2);right:-22vmax;bottom:-28vmax;animation:fl 26s ease-in-out infinite alternate-reverse}
.bg.img::before,.bg.img::after{display:none}.bg i{position:absolute;inset:0;background:#fff;transition:opacity .3s}
.bg.t0{--c1:#60a5fa;--c2:#fcd34d;background-color:#e8f2fd}.bg.t1{--c1:#fb7185;--c2:#fdba74;background-color:#fff0ec}
.bg.t2{--c1:#34d399;--c2:#67e8f9;background-color:#e6f9f4}.bg.t3{--c1:#6366f1;--c2:#a78bfa;background-color:#dedcf6}
@keyframes fl{to{transform:translate(9vmax,7vmax) scale(1.18)}}
#app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;max-width:1100px;margin:0 auto;padding:18px}
.glass,.card{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.8);border-radius:18px;box-shadow:var(--sh)}
.card{padding:14px 16px;margin-bottom:12px}
.side{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:4px;padding:10px;view-transition-name:side}
.side button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--mut);font:inherit;font-weight:500;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}
.side button:hover{background:rgba(37,99,235,.08);color:var(--ink)}
.side button.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:14px}.top>div{flex:1}
.sub{color:var(--mut);font-size:13px}
#st::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}
#st[data-c=ok]::before{background:#22a06b}#st[data-c=wt]::before{background:var(--acc)}
.hero{border-radius:22px;padding:34px 26px 26px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#1d4ed8,#38bdf8) center/cover;box-shadow:var(--sh);min-height:170px;display:flex;align-items:flex-end}
.hero h2{font-size:30px;margin:2px 0}.hero p{margin:0;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:12px}
.stat{text-align:center;margin:0}.stat b{display:block;font-size:32px;line-height:1.2;background:linear-gradient(135deg,var(--blue),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.g{flex:1;min-width:120px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--inp);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%;transition:border-color .2s,box-shadow .2s}
textarea{width:100%;min-height:90px}input[type=range]{padding:0;accent-color:var(--blue)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px rgba(37,99,235,.18)}
.b{display:inline-block;font:inherit;font-weight:600;border:0;color:#fff;background:linear-gradient(135deg,var(--blue),var(--sky));border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.b.s{background:rgba(255,255,255,.8);color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.b.d{background:none;color:var(--red);box-shadow:none;border:1.5px solid rgba(214,69,91,.5)}
.b:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,.side button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{display:inline-flex;gap:4px;align-items:center;background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:13px;margin:2px 3px 2px 0}
.chip button{border:0;background:none;color:var(--red);cursor:pointer;padding:0 2px}
.x{color:var(--red)}.ok{color:#1f8f5f}.tag{font-size:12px;background:var(--acc);color:#4a3200;border-radius:8px;padding:1px 8px;font-weight:600}
.done{text-decoration:line-through;opacity:.5}a{color:var(--blue)}.empty{color:var(--mut);text-align:center;padding:22px}
.sw{width:56px;height:56px;border-radius:16px;border:3px solid #fff;cursor:pointer;box-shadow:0 3px 10px rgba(16,48,77,.2)}
.sw.on{outline:3px solid var(--blue);outline-offset:2px}.sw.t0{background:linear-gradient(135deg,#60a5fa,#fcd34d)}.sw.t1{background:linear-gradient(135deg,#fb7185,#fdba74)}.sw.t2{background:linear-gradient(135deg,#34d399,#67e8f9)}.sw.t3{background:linear-gradient(135deg,#6366f1,#1e1b4b)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.gi{padding:8px;margin:0;overflow:hidden}.gi img,.gi .fi{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:6px;transition:transform .35s}.gi:hover img{transform:scale(1.04)}
.gi .fi{display:grid;place-items:center;background:linear-gradient(135deg,#dbeafe,#e0f2fe);font-weight:700;color:var(--blue);font-size:22px;text-decoration:none}
.gi .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
::view-transition-old(root){animation:.14s ease both vo}::view-transition-new(root){animation:.22s ease both vi}
@keyframes vo{to{opacity:0}}@keyframes vi{from{opacity:0}}
@media (prefers-reduced-motion:no-preference){
.card,.b,.side button,.hero{transition:transform .2s,box-shadow .2s,background .25s}
.card:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(16,48,77,.17)}.b:hover{transform:translateY(-1px)}.b:active{transform:scale(.97)}
#view.in>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#view.in>*:nth-child(2){animation-delay:.04s}#view.in>*:nth-child(3){animation-delay:.08s}#view.in>*:nth-child(4){animation-delay:.12s}#view.in>*:nth-child(5){animation-delay:.16s}#view.in>*:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){.bg::before,.bg::after{animation:none}}
#cp{position:fixed;left:0;right:0;bottom:0;z-index:15;pointer-events:none;text-align:center;color:rgba(91,65,41,.8);font:500 12px/1.4 Lora,Georgia,serif;letter-spacing:.05em;padding:14px 12px calc(7px + env(safe-area-inset-bottom,0px));background:linear-gradient(0deg,rgba(241,230,205,.7),rgba(241,230,205,0));text-shadow:0 0 6px rgba(255,255,255,.8)}
#cp::before,#cp::after{content:'\2766';margin:0 8px;color:#a77c4d;opacity:.7}
body{padding-bottom:calc(44px + env(safe-area-inset-bottom,0px))}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.bkc{width:100%;cursor:pointer;text-align:left;border:0;color:#fff;border-radius:6px 14px 14px 6px;padding:16px 12px 12px 20px;min-height:200px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#1d4ed8,#38bdf8);box-shadow:inset 8px 0 0 rgba(0,0,0,.2),var(--sh);font:inherit}
.bkc b{font:700 17px/1.3 Lora,serif}
.rd{position:fixed;inset:0;z-index:50;background:rgba(10,25,45,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;perspective:1800px;padding:10px}
.bk{position:relative}.bk>.pg{width:100%;height:100%}
[hidden]{display:none!important}
.lgw svg{width:84px;height:70px}.lgw img{width:84px;height:84px;object-fit:contain;border-radius:16px}#lu,#lp{padding:12px 14px;font-size:16px}
.bday{position:relative;overflow:hidden;border-radius:22px;padding:24px 20px;margin-bottom:14px;color:#4a2300;text-align:center;background:linear-gradient(135deg,#ffe29a,#ffb199 55%,#ff8fab);box-shadow:var(--sh)}
.bday::before,.bday::after{content:'';position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.35)}
.bday::before{left:-40px;top:-50px}.bday::after{right:-30px;bottom:-60px}.bday>*{position:relative}
.bday h2{font:700 30px/1.2 Lora,serif;margin:6px 0;color:#7a1237}
#fab{position:fixed;right:14px;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:flex-end;gap:8px;border:0;background:none;cursor:pointer;padding:0;font:inherit}
#fab .fl{background:#fff;color:var(--ink);border-radius:20px;padding:7px 12px;font-weight:600;font-size:13px;box-shadow:var(--sh);display:flex;align-items:center;gap:6px;margin-bottom:10px}
#fab .fl i{width:8px;height:8px;border-radius:50%;background:#b6c2cf}#fab.on .fl i{background:#22a06b;box-shadow:0 0 0 3px rgba(34,160,107,.25)}
#fab svg{filter:drop-shadow(0 8px 10px rgba(16,48,77,.35))}
#fab b{position:absolute;right:-4px;top:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 6px}
@media (prefers-reduced-motion:no-preference){#fab svg{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}}
#chp{position:fixed;right:14px;bottom:calc(156px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 28px));height:min(500px,calc(100vh - 200px));z-index:41;display:none;flex-direction:column;overflow:hidden;padding:0;margin:0}
#chp.open{display:flex}
@media (max-width:859px){#fab{bottom:calc(130px + env(safe-area-inset-bottom,0px))}#chp{bottom:calc(234px + env(safe-area-inset-bottom,0px));height:min(460px,calc(100vh - 300px))}}
.pg{overflow:hidden;background:#fffdf8;color:#222;border-radius:3px 10px 10px 3px;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 12px 0 14px -10px rgba(0,0,0,.3)}
.pg.ab{position:absolute;inset:0;transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pg>img{display:block;width:100%;height:100%;object-fit:contain}
.pg>div{height:100%;padding:24px;column-gap:48px;column-fill:auto;font:16px/1.6 Georgia,'Times New Roman',serif}
.pg>div p{margin:.5em 0;text-align:justify}.pg>div h1,.pg>div h2,.pg>div h3{font-size:1.25em;margin:.6em 0;text-align:center;break-after:avoid}.pg>div img{display:block;margin:auto;max-width:100%;max-height:300px;break-inside:avoid}
@media (max-width:859px){#app{display:block;padding:12px 12px 100px}
.side{position:fixed;left:10px;right:10px;bottom:calc(54px + env(safe-area-inset-bottom,0px));top:auto;flex-direction:row;gap:2px;padding:6px;border-radius:22px;z-index:20;overflow-x:auto}
.side button{flex:1;flex-direction:column;gap:2px;padding:7px 2px;min-width:0;flex:1 1 0;font-size:10px;text-align:center}.hero{padding:26px 18px 20px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div id="bg" class="bg"></div>
<div id="app"></div>
<footer id="cp">Sản phẩm của #thayhieugenZ | 2025</footer>
<script>
var anim=false;const sc=()=>/Đã lưu/.test(stat)?'ok':/Đang/.test(stat)?'wt':'lc';
const TABS=[['home','Tổng quan','M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10'],['cls','Lớp học','M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'],['note','Bài giảng','M6 3h9l5 5v13H6zM14 3v6h6M9 13h8M9 17h6'],['quiz','Quiz','M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM8 12l3 3 5-6'],['task','Lịch việc','M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1zM4 10h16M8 3v4M16 3v4'],['link','Tài liệu','M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'],['blog','Blog văn chương','M4 20h4L19 9l-4-4L4 16zM14 6l4 4'],['read','Đọc sách','M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM8 3v16'],['bot','Dạy chatbot','M12 3v3M6 8h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2zM9 13h.01M15 13h.01M9 17h6'],['call','Gọi tên','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M4 21a8 8 0 0 1 16 0'],['epub','Tạo epub','M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11'],['look','Giao diện','M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z']];
const BI='<svg width="44" height="36" viewBox="0 0 46 38" aria-hidden="true"><path d="M23 9C16 3 8 3 3 5V31C8 29 16 29 23 35ZM23 9C30 3 38 3 43 5V31C38 29 30 29 23 35Z" fill="#fff" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round"/><path d="M9 12q7-2 11 2M9 19q7-2 11 2M37 12q-7-2-11 2M37 19q-7-2-11 2" fill="none" stroke="#2563eb" stroke-width="1.5" opacity=".5"/><path d="M21 33h4v5l-2-2-2 2z" fill="#f5b942"/></svg>';
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const go=fn=>{anim=true;if(document.startViewTransition&&!RM)document.startViewTransition(fn);else fn()};
let AS=null;
const W={tx:1,gk:2,ck:3},WN={tx:'Thường xuyên',gk:'Giữa kì',ck:'Cuối kì'};
let S={classes:[],notes:[],quizzes:[],tasks:[],links:[],files:[],theme:0,scrim:35,bg:null,hero:null},tab='home',cid=null,qid=null,eid=null,play=null,q='',stat='Lưu trên trình duyệt này',ref=null,timer=null,armed='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>n==null?'–':String(Math.round(n*10)/10).replace('.',',');
const avg=st=>{let a=0,b=0;st.scores.forEach(x=>{a+=x.v*W[x.t];b+=W[x.t]});return b?a/b:null};
const norm=o=>Object.assign({classes:[],notes:[],quizzes:[],tasks:[],links:[],files:[],theme:0,scrim:35,bg:null,hero:null},o||{});
function save(){
  if(!OWN){try{localStorage.setItem('lvt',JSON.stringify({theme:S.theme}))}catch(e){}return}
  pubSave();
  if(!ref){try{localStorage.setItem('lvth',JSON.stringify(S))}catch(e){}return}
  stat='Đang lưu...';clearTimeout(timer);
  timer=setTimeout(async()=>{try{await ref.set({json:JSON.stringify(S),ts:Date.now()});stat='Đã lưu riêng tư cho bạn'}catch(e){stat='Chưa lưu được, hãy thử lại'}setStat()},700);
}
function setStat(){const e=document.getElementById('st');if(e){e.textContent=stat;e.dataset.c=sc()}}
const del=(k,fn)=>{if(armed===k){armed='';fn();save();render()}else{armed=k;render()}};
const dbtn=(k,a,d='')=>`<button class="b d" data-a="${a}" ${d}>${armed===k?'Bấm lần nữa để xóa':'Xóa'}</button>`;

function home(){
  const open=S.tasks.filter(t=>!t.done).sort((a,b)=>((a.due||'9')+(a.tm||''))<((b.due||'9')+(b.tm||''))?-1:1).slice(0,5);
  const n=S.classes.reduce((s,c)=>s+c.students.length,0);
  const un=S.tasks.filter(t=>!t.done).length;
  const hero=`<section class="hero" style="${S.hero?`background-image:linear-gradient(180deg,rgba(10,30,60,.08),rgba(10,30,60,.7)),url(${bu(esc(S.hero))})`:''}"><div><p>${new Date().toLocaleDateString('vi-VN',{weekday:'long',day:'numeric',month:'long'})}</p><h2>Chào mừng trở lại</h2><p>${un?`Bạn có ${un} việc cần làm`:'Hôm nay chưa có việc nào cần làm'}</p></div></section>`;
  return hero+bdayHome()+`<div class="grid">${[['Lớp',S.classes.length],['Học sinh',n],['Ghi chú',S.notes.length],['Việc cần làm',S.tasks.filter(t=>!t.done).length]].map(x=>`<div class="card stat"><b>${x[1]}</b><span class="sub">${x[0]}</span></div>`).join('')}</div>
  <div class="card"><h3>Việc sắp tới</h3>${open.length?open.map(t=>`<div>• ${esc(t.text)} ${t.due?`<span class="sub ${t.due<new Date().toISOString().slice(0,10)?'x':''}">(${esc(t.due)}${t.tm?' '+esc(t.tm):''})</span>`:''}</div>`).join(''):'<div class="sub">Chưa có việc nào, tuyệt vời.</div>'}</div>
  <div class="card"><h3>Ghi chú gần đây</h3>${S.notes.slice(-3).reverse().map(x=>`<div>• ${esc(x.title)}</div>`).join('')||'<div class="sub">Chưa có ghi chú.</div>'}</div>
  ${fbCard()}`;
}
function cls(){
  const c=S.classes.find(x=>x.id===cid);
  if(!c)return `<h2>Lớp học</h2><form class="card row" data-f="addClass"><input class="g" name="n" value="${esc(curYear())} | " placeholder="Tên lớp, ví dụ 9A1" required><button class="b">Thêm lớp</button></form>`
   +(sortedClasses().map(x=>`${yh(x)}<div class="card row"${isCol(x)?' hidden':''}><div class="g"><h3>${esc(cn(x))}</h3><span class="sub">${x.students.length} học sinh · tiến độ ${x.prog||0}%</span></div><button class="b s" data-a="openClass" data-id="${x.id}">Mở lớp</button></div>`).join('')||'<div class="empty">Chưa có lớp nào. Hãy thêm lớp đầu tiên.</div>');
  return `<div class="row" style="margin-bottom:8px"><button class="b s" data-a="back">← Các lớp</button><h2 class="g" style="margin:0">${esc(cn(c))}</h2>${dbtn('c'+c.id,'delClass')}</div>
  <div class="card row"><label class="sub" for="cy">Năm học</label><input id="cy" class="g" value="${esc(c.year||'')}" placeholder="2026-2027"><label class="sub" for="cnm">Tên lớp</label><input id="cnm" class="g" value="${esc(c.name)}"></div>
  <div class="card"><h3>Tiến độ chương trình: ${c.prog||0}%</h3><input type="range" min="0" max="100" value="${c.prog||0}" data-a="prog" style="width:100%"><input style="width:100%;margin-top:6px" placeholder="Đang dạy đến bài nào..." value="${esc(c.pn)}" data-a="pn"></div>
  ${bulkCard()}<form class="card row" data-f="addSt"><input class="g" name="n" placeholder="Tên học sinh" required><button class="b">Thêm học sinh</button></form>`
  +(c.students.map(s=>`<div class="card"><div class="row"><h3 class="g">${esc(s.name)}</h3><span>Điểm TB: <b>${fmt(avg(s))}</b></span>${dbtn('s'+s.id,'delSt','data-id="'+s.id+'"')}</div>

  addQuiz:f=>{const z={id:uid(),title:f.n.value.trim(),qs:[]};S.quizzes.push(z);qid=z.id},
  addQ:f=>S.quizzes.find(x=>x.id===qid).qs.push({q:f.q.value.trim(),o:[0,1,2,3].map(i=>f['o'+i].value.trim()),a:+f.a.value}),
  addTask:f=>S.tasks.push({id:uid(),text:f.t.value.trim(),due:f.d.value,tm:f.h.value,done:false}),
  addLink:f=>{let u=f.u.value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;S.links.push({id:uid(),name:f.n.value.trim(),url:u,note:f.d.value.trim()})}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.matches('input:not([type=radio]):not([type=checkbox])'))return;if(['prog','pn','stNote','pick','scrim'].includes(b.dataset.a)&&b.type!=='radio')return;const fn=A[b.dataset.a];if(fn)fn(b.dataset,b)});
document.addEventListener('input',e=>{const b=e.target.closest('[data-a]');if(b&&['prog','pn','stNote','scrim'].includes(b.dataset.a))A[b.dataset.a](b.dataset,b)});
async function shrink(f,m){try{const b=await createImageBitmap(f);const k=Math.min(1,m/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.86))||f}catch(e){return f}}
async function upl(f,m){if(!AS)return fdu(f,m);const r=await AS.upload(m?await shrink(f,m):f);return r.id}
const UP={
  upBg:async f=>{const o=S.bg;S.bg=await upl(f,1920);if(o&&AS)AS.delete(o).catch(()=>{})},
  upLogo:async f=>{const o=S.logo;S.logo=await upl(f,AS&&/png|svg|gif|webp/.test(f.type)?0:256);if(o&&AS)AS.delete(o).catch(()=>{})},
  upHero:async f=>{const o=S.hero;S.hero=await upl(f,1600);if(o&&AS)AS.delete(o).catch(()=>{})},
  upFiles:async f=>{S.files.push({id:await upl(f,/^image\//.test(f.type)&&f.type!=='image/svg+xml'?2400:0),name:f.name,type:f.type})}
};
document.addEventListener('change',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.a;
  if(k==='pick')return A.pick(b.dataset,b);
  if(k==='pimg'){pimgAdd(b.files[0]);b.value='';return}
  if(k==='impX'){impFile(b.files[0]);b.value='';return}
  if(k==='epf'){EF=b.files[0]||null;document.getElementById('efn').textContent=EF?EF.name:'Chưa chọn tệp';return}
  if(UP[k]&&b.files&&b.files.length){stat='Đang tải lên...';setStat();try{for(const f of b.files)await UP[k](f);save()}catch(err){stat='Không tải lên được: '+(err&&err.code==='too_large'?'tệp quá lớn':'thử lại sau');setStat()}b.value='';render()}});

F.addQA=f=>BOT().qa.push({id:uid(),q:f.q.value.trim(),a:f.a.value.trim()});
A.delQA=d=>del('qa'+d.id,()=>{BOT().qa=BOT().qa.filter(x=>x.id!==d.id)});
A.saveQA=d=>{const i=+d.i,a=CH.msgs[i],q=CH.msgs[i-1];if(!a||!q)return;BOT().qa.push({id:uid(),q:q.text,a:a.text});a.saved=1;save();drawChat()};
document.addEventListener('input',e=>{if(e.target.id==='bp'){BOT().persona=e.target.value;save()}else if(e.target.id==='bk'){BOT().kb=e.target.value;save()}else if(e.target.id==='cy'){const c=cur();if(c){c.year=e.target.value.trim();save()}}else if(e.target.id==='cnm'){const c=cur(),v=e.target.value.trim();if(c&&v){c.name=v;save()}}});
A.bulkAdd=()=>{const t=document.getElementById('bl').value,[n,k]=addRows(t.split(/\r?\n/).map(l=>l.split(/\t|;|,/)));BLM=n||k?'Đã thêm '+n+' em'+(k?', '+k+' em trùng tên nên bỏ qua':''):'Chưa có dòng hợp lệ';render()};
A.expX=()=>expX();
A.ytog=d=>{const k=d.y||'';YO[k]=isCol({year:k});render()};
F.savePost=f=>{S.la=f.a.value.trim();const o={title:f.t.value.trim(),body:f.b.value,pub:f.p.checked,author:f.a.value.trim(),when:f.w.value},a=S.posts||(S.posts=[]);if(PE)Object.assign(a.find(x=>x.id===PE),o);else a.push(Object.assign({id:uid(),ts:Date.now()},o));PE=null;PW=false};
A.editPost=d=>{PE=d.id;render();scrollTo(0,0)};A.cancelPost=()=>{PE=null;PW=false;render()};A.newPost=()=>{PW=true;render()};A.rcr=()=>loadReads();
A.togPost=d=>{const p=S.posts.find(x=>x.id===d.id);p.pub=!p.pub;save();render()};
A.delPost=d=>del('p'+d.id,()=>{S.posts=S.posts.filter(x=>x.id!==d.id)});
document.addEventListener('change',e=>{const id=e.target.dataset&&e.target.dataset.dob;if(!id)return;const s=cur()&&cur().students.find(x=>x.id===id);if(s){s.dob=e.target.value;save()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='lp')A.loginT();else if(e.target.id==='ci')A.csend()});
document.addEventListener('keydown',e=>{if(!BK)return;if(e.key==='ArrowRight')flip(1);else if(e.key==='ArrowLeft')flip(-1);else if(e.key==='Escape')A.closeBk()});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-f]');if(!f)return;e.preventDefault();F[f.dataset.f](f,f.dataset.id);save();render()});

/* ===== Sao lưu tự động vào tệp (File System Access API) ===== */
const FB={h:null,ok:false,msg:'',t:null,pend:null,hold:false},FBS=!!window.showSaveFilePicker;
const fbCnt=o=>['classes','notes','tasks','quizzes','links','posts'].reduce((n,k)=>n+((o&&o[k])||[]).length,0);
const fbIdb=()=>new Promise((r,j)=>{const q=indexedDB.open('lvbk',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
async function fbGet(){try{const d=await fbIdb();return await new Promise((r,j)=>{const q=d.transaction('h').objectStore('h').get('f');q.onsuccess=()=>r(q.result||null);q.onerror=()=>j(q.error)})}catch(e){return null}}
async function fbPut(h){try{const d=await fbIdb();await new Promise((r,j)=>{const t=d.transaction('h','readwrite');if(h)t.objectStore('h').put(h,'f');else t.objectStore('h').delete('f');t.oncomplete=r;t.onerror=()=>j(t.error)})}catch(e){}}
const fbSet=m=>{FB.msg=m;const e=document.getElementById('fbs');if(e)e.textContent=m};
const fbRef=()=>{if(tab==='home'&&!BK&&!document.querySelector('#view :focus'))render()};
async function fbPerm(ask){if(!FB.h)return false;try{let p=await FB.h.queryPermission({mode:'readwrite'});if(p!=='granted'&&ask)p=await FB.h.requestPermission({mode:'readwrite'});FB.ok=p==='granted'}catch(e){FB.ok=false}return FB.ok}
async function fbWrite(){
  if(!FB.h||!OWN||FB.hold)return;
  if(!await fbPerm(false)){fbSet('Cần cấp quyền ghi lại để tiếp tục sao lưu tự động');stat='Sao lưu tệp đang chờ cấp quyền, xem ở Tổng quan';setStat();fbRef();return}
  try{
    if(fbCnt(S)===0){const f=await FB.h.getFile();if(f.size>0){try{const o=JSON.parse(await f.text()),d=o.data||o;if(fbCnt(d)>0){S=norm(d);save();fbSet('Trang đang trống nên đã tự khôi phục dữ liệu từ tệp');render();return}}catch(e){}}}
    const w=await FB.h.createWritable();await w.write(JSON.stringify({app:'lop-van-thay-hieu',ts:Date.now(),data:S},null,1));await w.close();
    fbSet('Đã ghi vào "'+FB.h.name+'" lúc '+new Date().toLocaleTimeString('vi-VN'))
  }catch(e){fbSet('Không ghi được tệp: '+(e&&e.message||'thử lại'))}
}
function fbSched(){if(!FB.h||!OWN)return;clearTimeout(FB.t);FB.t=setTimeout(fbWrite,1500)}
const _save0=save;save=function(){_save0.apply(this,arguments);fbSched()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&FB.h&&OWN){clearTimeout(FB.t);fbWrite()}});
function fbCard(){
  if(!OWN)return '';
  const pend=FB.pend?`<div class="card"><b>Tìm thấy dữ liệu trong tệp (${fbCnt(FB.pend)} mục).</b><p class="sub">Khôi phục sẽ thay thế dữ liệu đang có trên trang này.</p><div class="row"><button class="b" data-a="fbRestore">Khôi phục từ tệp</button>${FB.hold?'<button class="b s" data-a="fbKeep">Giữ dữ liệu hiện tại, ghi đè tệp</button>':''}<button class="b s" data-a="fbCancel">Hủy</button></div></div>`:'';
  const body=!FBS?'<div class="x">Trình duyệt này chưa hỗ trợ ghi tệp tự động. Hãy dùng Chrome hoặc Edge trên máy tính.</div>'
   :FB.h?`<div>Đang liên kết với tệp: <b>${esc(FB.h.name)}</b></div><div class="sub" id="fbs" style="margin:4px 0 8px">${esc(FB.msg)}</div><div class="row">${FB.ok?'':'<button class="b" data-a="fbPerm">Cấp quyền ghi lại</button>'}<button class="b s" data-a="fbNow">Sao lưu ngay</button><button class="b s" data-a="fbPick">Đổi tệp</button><button class="b d" data-a="fbOff">Ngắt liên kết</button></div>`
   :`<div class="row"><button class="b" data-a="fbPick">Chọn tệp sao lưu</button></div><div class="sub" id="fbs" style="margin-top:6px">${esc(FB.msg)}</div>`;
  return pend+`<div class="card"><h3>Sao lưu tự động vào tệp</h3><p class="sub" style="margin:4px 0 10px">Chọn một tệp .json trong thư mục bạn muốn. Mỗi khi có thay đổi, trang sẽ tự ghi lại vào tệp đó.</p>${body}<div class="row" style="margin-top:10px"><label class="b s">Khôi phục từ tệp...<input type="file" accept=".json,application/json" hidden data-a="fbRf"></label></div></div>`;
}
A.fbPick=async()=>{
  try{const h=await showSaveFilePicker({suggestedName:'lop-van-thay-hieu-sao-luu.json',types:[{description:'Tệp sao lưu JSON',accept:{'application/json':['.json']}}]});
    FB.h=h;FB.hold=false;FB.pend=null;await fbPut(h);FB.ok=true;await fbWrite();render()}
  catch(e){if(e&&e.name==='AbortError')return;fbSet(e&&e.name==='SecurityError'?'Trình duyệt chặn chọn tệp trong khung này. Hãy mở trang ở tab riêng bằng Chrome hoặc Edge rồi thử lại':'Không chọn được tệp: '+(e&&e.message||'thử lại'));render()}
};
A.fbPerm=async()=>{await fbPerm(true);if(FB.ok)await fbWrite();render()};
A.fbNow=async()=>{await fbWrite();render()};
A.fbOff=async()=>{FB.h=null;FB.ok=false;FB.hold=false;FB.pend=null;await fbPut(null);fbSet('');render()};
A.fbRestore=()=>{if(!FB.pend)return;S=norm(FB.pend);FB.pend=null;FB.hold=false;save();fbSet('Đã khôi phục dữ liệu từ tệp');render()};
A.fbKeep=async()=>{FB.pend=null;FB.hold=false;await fbWrite();render()};
A.fbCancel=()=>{FB.pend=null;if(FB.hold)A.fbOff();else render()};
document.addEventListener('change',async e=>{const b=e.target.closest('[data-a=fbRf]');if(!b)return;const f=b.files[0];b.value='';if(!f)return;
  try{const o=JSON.parse(await f.text()),d=o.data||o;if(!fbCnt(d)&&!(d.bg||d.theme!=null))throw 0;FB.pend=d;fbSet('')}catch(err){fbSet('Tệp này không phải bản sao lưu hợp lệ')}render()});
async function fbBoot(){if(!FBS)return;FB.h=await fbGet();if(FB.h){await fbPerm(false);fbSet(FB.ok?'Sao lưu tự động đang bật':'Cần cấp quyền ghi lại để tiếp tục sao lưu tự động');if(FB.ok)fbWrite()}render()}
(async function init(){
  try{S=norm(JSON.parse(localStorage.getItem('lvth')))}catch(e){}
  render();
  try{
    try{AS=await claude.use('assets')}catch(e){}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    DB=db;USR=user;ISO=user?await user.isOwner():true;
    try{const s0=await db.doc('pub/main').get();if(s0.exists){LG=JSON.parse(s0.data().json).logo||null;if(!ROLE)render()}}catch(e){}
    for(;;){await ready();if(ROLE==='t'&&!ISO){ROLE=null;OWN=false;LM='Tài khoản đang dùng không phải chủ trang nên chưa đăng nhập thầy được';try{sessionStorage.removeItem('lvrole')}catch(e){}render();continue}break}
    OWN=ROLE==='t';if(!OWN)tab='read';loadBooks();chatBoot();
    if(!OWN){await loadPub();return}
    if(!db||!user)return;
    const id=await user.id();const r=db.doc('data/users/'+id+'/main');const s=await r.get();
    if(s.exists){S=norm(JSON.parse(s.data().json))}
    ref=r;pubSave();loadReads();stat='Đã lưu riêng tư cho bạn';
    if(!s.exists&&(S.classes.length+S.notes.length+S.tasks.length+S.quizzes.length+S.links.length))save();
    try{localStorage.removeItem('lvth')}catch(e){}
    render();fbBoot();
  }catch(e){}
  if(!DB){try{await ready();OWN=ROLE==='t';if(!OWN)tab='read';loadBooks()}catch(e){}}
  if(AS)render();
})();
</script>
